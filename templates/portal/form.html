{% extends 'portal/base.html' %}
{% block title %}{{ title }} · Yaaron Ka Safar{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ADMIN WORKSPACE</p><h1>{{ title }}</h1></div><a class="text-link" href="/admin/students/">Back to students</a></div>
<section class="form-panel"><form method="post" class="form-stack">{% csrf_token %}
  <label>Full name<input name="full_name" value="{{ form_data.full_name|default:'' }}" required></label>
  <div class="form-grid"><label>Admission number<input name="admission_number" value="{{ form_data.admission_number|default:'' }}" placeholder="IVS3-037" required></label><label>Phone<input name="phone" value="{{ form_data.phone|default:'' }}"></label></div>
  <div class="form-grid"><label>Class<input name="class_name" value="{{ form_data.class_name|default:'' }}"></label><label>Division<input name="division" value="{{ form_data.division|default:'' }}"></label></div>
  <div class="form-grid"><label>Trip fee<input type="number" min="0" step="0.01" name="trip_fee" value="{{ form_data.trip_fee|default:'6450' }}" required></label><label>Initial password<input type="password" name="password" minlength="8" required></label></div>
  <button class="button button-primary" type="submit">Create student account</button>
</form></section>
{% endblock %}
